[package]
name = "attestation"
version = "0.1.0"
edition = "2021"
description = "Solana-bound EIP-712-style auditor attestation digest + eth-address recovery helpers"
license = "MIT"

[lib]
crate-type = ["lib"]

[dependencies]
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
# NOTE: intentionally no secp256k1 signing crate here. A signing lib (k256) pulls
# `zeroize >=1.5`, which conflicts with the `curve25519-dalek 3.2.1` that Solana's
# `solana-program` pins (`zeroize <1.4`) once this crate shares a workspace with
# the Anchor programs. The eth-address derivation is proven below
# against the known anvil pubkey; signature *recovery* is proven end-to-end by the
# TS parity test (ethers) and, on-chain, by the `secp256k1_recover` syscall.
hex = "0.4"
# For reading shared/vectors/burn-attestation.json directly in tests
# (see crates/pricing-math for the same include_str! + serde pattern).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
