[package]
name = "rwa-transfer-hook"
version = "0.1.0"
edition = "2021"
description = "Token-2022 transfer hook enforcing compliance + pause (RWAToken._update on Solana)"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = { version = "1.1.2", features = ["token", "token_2022"] }
# Pinned exactly to the versions the committed Cargo.lock resolves,
# matching the spl-token-2022-interface 2.x anchor-spl 1.1.2 pulls in.
spl-transfer-hook-interface = "=2.1.0"
spl-tlv-account-resolution = "=0.11.1"
rwa-compliance = { path = "../rwa-compliance", features = ["no-entrypoint"] }
