[package]
name = "rwa-compliance"
version = "0.1.0"
edition = "2021"
description = "Wallet allowlist + expiry + project pause registry (ComplianceRegistry.sol on Solana)"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "rwa_compliance"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
compliance-core = { path = "../../crates/compliance-core" }
