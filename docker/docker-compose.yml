# ============================================================================
# LOCAL DEVELOPMENT ONLY — DO NOT EXPOSE OR DEPLOY THIS FILE TO PRODUCTION.
# All services bind to 127.0.0.1 (loopback) and Mongo/IPFS run WITHOUT auth,
# which is fine for a laptop but a full-database/IPFS-node compromise if the
# host is reachable from an untrusted network. For production: run Mongo with
# authentication (MONGO_INITDB_ROOT_USERNAME/_PASSWORD + a real user), restrict
# the IPFS API to loopback behind an authenticated proxy, and put the API server
# behind TLS. See docs/operator/operator-guide.md.
# ============================================================================
services:
  mongo:
    # Docker-official image (not mongodb-community-server): its entrypoint runs
    # as root, chowns the mounted /data/db to the mongodb user, then drops
    # privileges — so a host bind mount below works with no chmod/chown from you.
    # (The community image runs straight as non-root and can't write an
    # owner-mismatched bind mount: "create_directory /data/db/journal: Permission
    # denied".) mongo:7 also bundles mongosh for the healthcheck and matches the
    # image the API e2e uses.
    image: mongo:7
    command: --replSet rs0 --bind_ip_all --port 27017
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27017'}]}) }" | mongosh
      interval: 5s
      timeout: 15s
      start_period: 15s
      retries: 10
    # For production, uncomment and set strong credentials, then require them in the server URI:
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: rwa
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD}
    environment:
      MONGO_INITDB_DATABASE: rwa
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - ./data/mongo:/data/db

  ipfs:
    image: ipfs/kubo:latest
    # Kubo's HTTP API (5001) is unauthenticated — keep it on loopback only.
    ports: ["127.0.0.1:5001:5001", "127.0.0.1:8080:8080"]
    volumes:
      - ./data/ipfs:/data/ipfs

  # Local Solana cluster for the solana/ Anchor programs (Token-2022 + transfer
  # hook). Agave 4.x, matching the migrated stack (Anchor 1.1.2 / Token-2022 v11. 
  # RPC on 8899, PubSub (websocket) on 8900.
  #
  # NOTE: permissioned-burn extension needs the Token-2022 **v11** program,
  # which the stock image's bundled Token-2022 does not provide. For the full
  # integration suite, build Token-2022 v11 from source (README "Building & testing")
  # and inject it: mount the .so and uncomment the `--bpf-program` line below. Without
  # it, this validator serves the non-permissioned-burn flows only.
  # `--deactivate-feature` (SIMD-0500) lets the v0-arch programs deploy via the
  # upgradeable loader; deploy them with `solana program deploy … --use-rpc`.
  solana:
    build:
      context: .
      dockerfile: solana/Dockerfile
    # Agave 4.x's accounts-db hard-requires io_uring; Docker's default seccomp
    # profile blocks the io_uring_setup/enter/register syscalls, so the runtime
    # aborts ("assertion failed: io_uring_supported()"). Dropping seccomp lets
    # them through. Acceptable here because this stack is local-dev-only (see the
    # header); for a tighter setup, supply a custom profile that adds just the
    # io_uring syscalls to the default via `seccomp=./io_uring-seccomp.json`.
    security_opt:
      - seccomp=unconfined
    # --limit-ledger-size: the indexer discovers everything through
    # getSignaturesForAddress, served from the address->signature index. The
    # default (10000 shreds) purges that within MINUTES, after which the RPC
    # answers with an empty array rather than an error — so the indexer
    # silently stops ingesting, chain_events stays empty, and `reindex` becomes
    # irreversible because the chain can no longer supply what it deleted.
    # Keep the whole dev session's history instead.
    entrypoint:
      - /bin/sh
      - -ceu
      - |
        ip="$$(hostname -i | awk '{print $$1}')"
        echo "solana-test-validator binding to container IP $$ip"
        exec solana-test-validator \
          --reset \
          --bind-address "$$ip" \
          --rpc-port 8899 \
          --deactivate-feature B8JJXCy5amZyWG9r7EnUYLwzXSXTxG7GZ1qZ1qggo83g \
          --account EBbtqhpUzonDFRJewDv7UFdwJj73ZuwZPcgRbAmfsPuj /accounts/test-wallet-account.json \
          --ledger /solana-ledger \
          --limit-ledger-size 100000000 \
          --bpf-program TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb /programs/spl_token_2022.so
    healthcheck:
      # RPC is on the container IP, not loopback, so target the same IP here.
      test: ["CMD-SHELL", "solana cluster-version --url http://$$(hostname -i | awk '{print $$1}'):8899"]
      interval: 5s
      timeout: 10s
      start_period: 20s
      retries: 10
    ports: ["127.0.0.1:8899:8899", "127.0.0.1:8900:8900"]
    volumes:
      - ./data/solana:/solana-ledger
      # Pre-funded test wallet loaded into genesis via --account above. The
      # matching signer keypair is docker/solana/test-wallet-keypair.json.
      - ./solana/test-wallet-account.json:/accounts/test-wallet-account.json:ro
      - ./solana/spl_token_2022.so:/programs/spl_token_2022.so:ro  # v11 program (see note)
